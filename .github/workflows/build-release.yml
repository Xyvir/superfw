name: SuperFW release
run-name: Build a full SuperFW release

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [sd, lite, chis]

    steps:
      - name: Install dependencies
        run: sudo apt-get install -y gcc-arm-none-eabi
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Get short SHA
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} \vert{} cut -c1-8)" >> $GITHUB_OUTPUT
      - name: Arrange files
        run: |
          cp res/patches.db patches.db
      - name: Build firmware
        run: |
          make BOARD=${{ matrix.board }} clean
          make BOARD=${{ matrix.board }} COMPRESSION_RATIO=10
          mv superfw.gba superfw-${{ matrix.board }}.fw
          cp superfw.dldi.payload superfw-${{ matrix.board }}.dldi
      - name: Upload firmware release
        uses: actions/upload-artifact@v4
        with:
          name: superfw-release-${{ matrix.board }}-${{ steps.slug.outputs.sha8 }}
          path: |
            superfw-${{ matrix.board }}.fw
      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: superfw-debug-${{ matrix.board }}-${{ steps.slug.outputs.sha8 }}
          path: |
            superfw-${{ matrix.board }}.fw
            directsave.elf
            firmware.elf
            firmware.ewram.elf
            ingamemenu.elf
            superfw.dldi.elf
      - name: Upload extra artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: superfw-dev-${{ matrix.board }}-${{ steps.slug.outputs.sha8 }}
          path: |
            superfw-${{ matrix.board }}.fw
            superfw-${{ matrix.board }}.dldi
            patches.db

  release:
    needs: build-firmware
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - uses: actions/download-artifact@v4
        with:
          pattern: 'superfw-release-*'
          path: artifacts
      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "RELEASE_TAG=v$(date +'\%Y\%m\%d\%H\%M\%S')" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi
      - name: Create release and upload firmware
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "Release ${RELEASE_TAG}" \
            --generate-notes \
            artifacts/**/*.fw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
